<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    /* --- PERFECT RESET --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    
    /* --- MAIN CONTAINER --- */
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      gap: 8px;
    }
    
    /* --- TITLE (CENTER TOP) --- */
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    /* --- CANVAS CONTAINER --- */
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
    }
    
    #canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      background: #0a0a0a;
    }
    
    #canvas-wrapper canvas {
      display: block !important;
      max-width: 100%;
      max-height: 100%;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      border-radius: 2px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    
    /* --- SHIRT MOCKUP --- */
    #shirt-mockup {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      z-index: 2;
    }
    #shirt-mockup.active {
      display: block !important;
      animation: fadeIn 0.6s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    
    /* --- BOTTOM BAR --- */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    /* --- CONTROLS --- */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    /* --- SHIRT BUTTON --- */
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);

      background: rgba(201, 168, 76, 0.06);
    }

    }
    .controls.shirt-btn .icon {

    }
    
    /* --- INFO ROW --- */
    .info-row {

      color: rgba(255,255,255,0.3);

      flex-wrap: wrap;

    }
    .info-row .value {

    /* --- DESCRIPTION --- */
    .description {

      .controls-row { gap: 6px; }
      .info-row { font-size: 8px; gap: 10px; }
      .info-row .info-item { padding: 2px 8px; }

    @media (max-width: 480px) {

      #canvas-container { flex: 1; min-height: 0; height: 100%; padding: 0 8px; }
      .bottom-bar { width: auto; max-width: 180px; flex-shrink: 0; gap: 4px; padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; letter-spacing: 0.4px; }
      .controls-row { flex-direction: column; gap: 4px; }
      .info-row { font-size: 7px; gap: 6px; flex-direction: column; align-items: stretch; }
      .info-row .info-item { padding: 2px 8px; justify-content: center; }

    @media (orientation: landscape) and (max-height: 380px) {
      #main-container { padding: 6px 12px; gap: 3px; }

      .info-row { font-size: 6px; gap: 4px; }

      #canvas-wrapper canvas { image-rendering: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .controls, #canvas-wrapper canvas, #shirt-mockup { transition: none; }
      #shirt-mockup.active { animation: none; }
    }
  </style>

<div id="main-container">

  </div>

  <div id="canvas-container">

      <img id="shirt-mockup" src="Socialism-of-Shapes.jpg" alt="Socialism of Shapes on T-Shirt" />
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

    <!-- CONTROLS ROW -->
    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> regenerate <span class="sep">—</span> <span class="key">S</span> save
      </div>

        <span class="icon">◷</span> apparel
      </div>

        <span class="label">background</span>

      <div class="info-item">
        <span class="label">shadow</span>
        <span class="value" id="shadowDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">shapes</span>
        <span class="value" id="shapesDisplay">---</span>
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="description">
      <span class="highlight">socialism of shapes</span>
      <span class="sep">·</span>
      <span class="highlight">16 shape modes</span>
      <span class="sep">·</span>
      <span class="highlight">generative art</span>
      <span class="sep">·</span>
      <span class="highlight">collective patterns</span>
    </div>

  </div>

</div>

<script>
// ============================================
// SOCIALISM OF SHAPES — Generative Art
// ============================================

const ratio = 1 / 1;
const prefix = 'Socialism of Shapes';

// ============================================
// Random utility (replaces fxhash)
// ============================================
let seed = Math.random() * 2147483647;

function setSeed(newSeed) {
    seed = newSeed;
}

function random() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
}

// ============================================
// Color palettes
// ============================================
const backgroundColours = [
    '#F5F5F5','#9AFEFF','#AAF0D1','#CCFB5D','#E3F9A6',
    '#FED8B1','#FFFF33','#BCB88A','#FCDFFF','#FAAFBE',
    '#F7CAC9','#FFCBA4','#FBD5AB','#FFF0DB','#D291BC',
    '#FEA3AA','#FFB2D0','#EDC9AF','#FFF8DC','#CCFFFF',
    '#87CEFA','#BDEDFF'
];
const backgroundNames = [
    'WhiteSmoke','Electric Blue','Magic Mint','Tea Green','Organic Brown',
    'Light Orange','Neon Yellow','Sage','Cotton Candy','Donut Pink',
    'Rose Quartz','Deep Peach','Coral Peach','Light Beige','Pastel Violet',
    'Pastel Pink','Powder Pink','Desert Sand','Cornsilk','Light Slate',
    'LightSkyBlue','Robin Egg Blue'
];

const ShadowColours = [
    '#000000','#040720','#0C090A','#151B54','#033E3E',
    '#25383C','#2C3539','#004225','#483C32','#3D3635',
    '#3B2F2F','#43302E','#800000','#551606','#2F0909',
    '#2B1B17','#990012','#2E1A47','#36013F','#4B0150',
    '#4E5180','#583759','#550A35'
];
const ShadowNames = [
    'black','Black Blue','Night','Night Blue','Deep Teal',
    'DarkSlateGray','Gunmetal','Lotus Green','Taupe','Gray Brown',
    'Dark Coffee','Old Burgundy','Maroon','Blood Night','Dark Maroon',
    'Midnight','Red Wine','Midnight Purple','Deep Purple','Dark Purple',
    'Purple Navy','Plum Purple','Purple Lily'
];

const foregroundColours = [
    ['#9F21DE','#60DE21'],
    ['#F20DB2','#0DF24D'],
    ['#1DAEE2','#E2511D','#4ABEE8','#EA7348'],
    ['#C1200F','#0FC120','#200FC1'],
    ['#EEA211','#11EEA2','#A211EE'],
    ['#FAFB04','#04FAFB','#FB04FA'],
    ['#A0D42B','#2BA0D4','#D42BA0'],
    ['#46EC13','#1346EC','#EC1346'],
    ['#E916C0','#E9A816','#16E93F','#1657E9'],
    ['#F00F56','#C7F00F','#0FF0A9','#380FF0'],
    ['#F00F1A','#8BF00F','#0FF0E5','#740FF0'],
    ['#EB1914','#EB8414','#EB147B'],
    ['#EFBB10','#B4EF10','#EF4B10'],
    ['#C0A23F','#9DC03F','#C0623F'],
    ['#A4EB14','#38EB14','#EBC714'],
    ['#45BA4E','#45BA89','#76BA45'],
    ['#29D6A4','#29B1D6','#29D64E'],
    ['#1EBAE1','#1E59E1','#1EE1A6'],
    ['#3A77C5','#423AC5','#3ABDC5'],
    ['#1732E8','#6417E8','#179BE8'],
    ['#673AC5','#AD3AC5','#3A52C5'],
    ['#9216E9','#E916D6','#2916E9'],                              
    ['#DC11EE','#EE1191','#6E11EE'],
    ['#A855AA','#AA5582','#7D55AA'],
    ['#F00FBE','#F00F4D','#F00F4D'],
    ['#D42B85','#D42B31','#CE2BD4'],
    ['#DD0D44','#DD3E0D','#DD0DAC'],
    ['#A55A5C','#A57D5A','#A55A82'],
    ['#B7489F','#9FB748','#489FB7'],
    ['#78B649','#4978B6','#B64978'],
    ['#0EF1BB','#BB0EF1','#F1BB0E'],
    ['#93E01F','#1F93E0','#E01F93'],
    ['#E7BE18','#18E756','#1841E7','#E718A9'],
    ['#6A1DE2','#E21D33','#95E21D','#1DE2CC'],
    ['#47D629','#299DD6','#B829D6','#D66229'],
    ['#816A95','#9A88AA'],
    ['#22DDB9','#4EE4C7'],
    ['#292ED6','#D62984','#D6D129','#29D67B','#808080','#E98DBD','#D62935','#299ED6'],
    ['#E21D93','#A4D1D1','#D4D629','#1A6386','#B84747','#D1A4A4','#29D6A4','#ABD9EF'],
    ['#ADD7A9','#A9A4D1','#E1D466','#971D7E','#048184','#E58400','#F7D8F6','#04FDEB'],
    ['#A47F5B','#5B80A4'],
    ['#2AD86E','#BDD82A'],
    ['#086D58','#0DA685','#0FBF9A','#11DBB0','#1FEEC2','#58F2D1','#92F7E1','#C5FBEF'],
    ['#8D1E03','#C12904','#E53105','#FA4A1F','#FB7251','#FC9981','#FDC3B4','#FEDDD5']
];

// ============================================
// State
// ============================================
let features = {};
let resizeTmr = null;
let thumbnailTaken = false;
let animated = false;
let nextFrame = null;
let showingShirt = false;

// ============================================
// Setup
// ============================================
function setup() {
    const backgroundIndex = Math.floor(random() * backgroundColours.length);
    const ShadowIndex = Math.floor(random() * ShadowColours.length);
    const foregroundIndex = Math.floor(random() * foregroundColours.length);

    features.backgroundColour = backgroundColours[backgroundIndex];
    features.ShadowColor = ShadowColours[ShadowIndex];
    features.lineColours = foregroundColours[foregroundIndex];
    features.backgroundName = backgroundNames[backgroundIndex];
    features.shadowName = ShadowNames[ShadowIndex];
    features.shapeMode = Math.floor(random() * 16);

    // Update info display
    document.getElementById('bgDisplay').textContent = features.backgroundName;
    document.getElementById('shadowDisplay').textContent = features.shadowName;
    document.getElementById('shapesDisplay').textContent = features.shapeMode + 1;
}

// ============================================
// Shape functions
// ============================================
function Triangle(ctx, x, y, size, angle) {
    const halfHeight = Math.sqrt(3) / 2 * size;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, halfHeight);
    ctx.lineTo(-size, -halfHeight);
    ctx.lineTo(size, -halfHeight);
    ctx.closePath();
    ctx.restore();
}

function Square(ctx, x, y, size, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(-size, size);
    ctx.lineTo(-size, -size);
    ctx.lineTo(size, -size);
    ctx.lineTo(size, size);
    ctx.closePath();
    ctx.restore();
}

function Rectangle(ctx, x, y, size1, size2, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(-size1, size2);
    ctx.lineTo(-size1, -size2);
    ctx.lineTo(size1, -size2);
    ctx.lineTo(size1, size2);
    ctx.closePath();
    ctx.restore();
}

function shape(ctx, x, y, size, angle) {
    const Q = Math.floor(random() * 8);
    if (Q == 0) {
        Square(ctx, x, y, size, angle);
    } else if (Q == 1) {
        Triangle(ctx, x, y, size, angle);
    } else if (Q == 2) {
        Triangle(ctx, x, y, size, angle + Math.PI / 2);
    } else if (Q == 3) {
        Triangle(ctx, x, y, size, angle + Math.PI);
    } else if (Q == 4) {
        Triangle(ctx, x, y, size, angle + 3 * Math.PI / 2);
    } else if (Q == 5) {
        Rectangle(ctx, x, y, random() * size, random() * size, angle);
    } else if (Q == 6) {
        ctx.arc(x, y, size, 0, 2 * Math.PI);
    }
}

// ============================================
// Canvas drawing
// ============================================
function drawCanvas() {
    window.cancelAnimationFrame(nextFrame);

    const canvas = document.getElementById('target');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;

    ctx.fillStyle = features.backgroundColour;
    ctx.fillRect(0, 0, w, h);
    
    const A = features.shapeMode;
    const space = w / (random() * 40 + 10);
    const size = w / (random() * 40 + 20);

    for (let i = -5 * space; i < w; i += space) {
        for (let j = -5 * space; j < h; j += space) {
            const n = 2 * random();
            ctx.strokeStyle = features.lineColours[Math.floor(random() * features.lineColours.length)];
            ctx.lineWidth = w / (random() * 600 + 200);
            ctx.shadowColor = features.ShadowColor;
            ctx.shadowBlur = w / (random() * 70 + 80);

            if (A == 0) {
                const S = size * 20 * random();
                if (n < random() * 1.6 + 0.1) {
                    ctx.beginPath();
                    ctx.moveTo(i, j);
                    ctx.lineTo(i + S, j + S);
                    ctx.stroke();
                    ctx.closePath();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(i + S, j);
                    ctx.lineTo(i, j + S / 2);
                    ctx.stroke();
                    ctx.closePath();
                }
            } else if (A == 1) {
                if (n < random() * 1.6 + 0.1) {
                    ctx.beginPath();
                    ctx.arc(i + size, j + size, size, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.closePath();
                } else {

// ============================================
// Layout
// ============================================
function layoutCanvas() {
    window.cancelAnimationFrame(nextFrame);

    const wrapper = document.getElementById('canvas-wrapper');
    const rect = wrapper.getBoundingClientRect();
    
    const wWidth = rect.width;
    const wHeight = rect.height;
    const dpr = window.devicePixelRatio || 1;

    // Remove existing canvases
    const canvases = wrapper.getElementsByTagName('canvas');
    Array.from(canvases).forEach(c => c.remove());

    let cWidth = wWidth;
    let cHeight = cWidth / ratio;

    if (cHeight > wHeight) {
        cHeight = wHeight;
        cWidth = wHeight * ratio;
    }

    const targetWidth = Math.floor(cWidth * dpr);
    const targetHeight = Math.floor(cHeight * dpr);

    const canvas = document.createElement('canvas');
    canvas.id = 'target';
    canvas.width = targetWidth;
    canvas.height = targetHeight;
    wrapper.appendChild(canvas);

    canvas.style.position = 'absolute';
    canvas.style.width = cWidth + 'px';
    canvas.style.height = cHeight + 'px';
    canvas.style.top = '50%';
    canvas.style.left = '50%';
    canvas.style.transform = 'translate(-50%, -50%)';
    canvas.style.zIndex = '1';

    canvas.style.display = 'block';

    drawCanvas();
}

// ============================================
// Download
// ============================================
function downloadCanvas() {
    if (showingShirt) {
        const link = document.createElement('a');
        link.download = 'Socialism_of_Shapes_Shirt.png';
        const img = document.getElementById('shirt-mockup');
        if (img && img.src) {
            link.href = img.src;
        } else {
            const canvas = document.getElementById('target');
            if (canvas) link.href = canvas.toDataURL('image/png');
        }
        link.click();
        return;
    }
    
    const canvas = document.getElementById('target');
    if (!canvas) return;
    const link = document.createElement('a');
    const hash = Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
    link.download = prefix + '_' + hash + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
}

// ============================================
// Regenerate
// ============================================
function regenerate() {
    setSeed(Math.random() * 2147483647);
    setup();
    const wrapper = document.getElementById('canvas-wrapper');
    const canvas = wrapper.querySelector('canvas');
    if (canvas) {
        canvas.remove();
    }
    const shirtMockup = document.getElementById('shirt-mockup');
    shirtMockup.classList.remove('active');
    showingShirt = false;
    const shirtToggle = document.getElementById('shirtToggle');
    shirtToggle.classList.remove('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
    layoutCanvas();
}

// ============================================
// Toggle Shirt
// ============================================
function toggleShirt() {
    showingShirt = !showingShirt;
    
    const canvas = document.getElementById('target');
    const shirtMockup = document.getElementById('shirt-mockup');
    const shirtToggle = document.getElementById('shirtToggle');
    
    if (showingShirt) {
        if (canvas) {
            canvas.style.display = 'block';
            canvas.style.zIndex = '1';
        }
        shirtMockup.classList.add('active');
        shirtMockup.style.zIndex = '2';
        shirtToggle.classList.add('active');
        shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
    } else {
        if (canvas) {
            canvas.style.display = 'block';
            canvas.style.zIndex = '1';
        }
        shirtMockup.classList.remove('active');
        shirtToggle.classList.remove('active');
        shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
    }
}

// ============================================
// Init
// ============================================
function init() {
    setup();
    layoutCanvas();

    // Resize handler
    window.addEventListener('resize', () => {
        clearTimeout(resizeTmr);
        resizeTmr = setTimeout(layoutCanvas, 100);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S') {
            e.preventDefault();
            downloadCanvas();
        }
        if (e.key === 'r' || e.key === 'R') {
            e.preventDefault();
            regenerate();
        }
        if (e.key === 't' || e.key === 'T') {
            e.preventDefault();
            toggleShirt();
        }
        if (e.key === ' ' || e.key === 'Space') {
            e.preventDefault();
            regenerate();
        }
    });

    // Button handlers
    document.getElementById('controlsBar').addEventListener('click', regenerate);
    document.getElementById('controlsBar').addEventListener('touchend', function(e) {
        e.preventDefault();
        regenerate();
    });
    
    document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
    document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
        e.preventDefault();
        toggleShirt();
    });
}

// Start
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}

// Expose functions globally
window.regenerate = regenerate;
window.saveImage = downloadCanvas;
window.toggleShirt = toggleShirt;
